<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Racing Evolution</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0f1118;
        color: #ecf0ff;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .shell {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .hud {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        opacity: 0.95;
      }
      .pill {
        background: #171b28;
        border: 1px solid #2b3550;
        border-radius: 999px;
        padding: 5px 12px;
      }
      canvas {
        width: min(1200px, 96vw);
        height: auto;
        border-radius: 12px;
        border: 1px solid #2c3552;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.42);
        background: #1d2436;
      }
      .hint {
        opacity: 0.7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="hud">
        <span class="pill" id="generation"></span>
        <span class="pill" id="alive"></span>
        <span class="pill" id="bestDistance"></span>
        <span class="pill" id="fps"></span>
      </div>
      <canvas id="race" width="1200" height="700"></canvas>
      <div class="hint">100 ИИ едут по фиксированной трассе, каждый новый заезд учится у лучшего из прошлого поколения.</div>
    </main>

    <script>
      const canvas = document.getElementById('race');
      const ctx = canvas.getContext('2d');

      const hud = {
        generation: document.getElementById('generation'),
        alive: document.getElementById('alive'),
        bestDistance: document.getElementById('bestDistance'),
        fps: document.getElementById('fps'),
      };

      const POPULATION = 100;
      const MAX_STEPS = 2200;
      const MUTATION_STRENGTH = 0.35;
      const TRACK_RADIUS = 66;
      const CAR_LENGTH = 12;
      const CAR_WIDTH = 7;

      const centerLine = [
        { x: 180, y: 350 },
        { x: 260, y: 220 },
        { x: 430, y: 160 },
        { x: 620, y: 170 },
        { x: 840, y: 220 },
        { x: 1020, y: 350 },
        { x: 940, y: 500 },
        { x: 760, y: 560 },
        { x: 560, y: 540 },
        { x: 380, y: 510 },
        { x: 250, y: 440 },
      ];

      const segments = [];
      let totalLength = 0;
      for (let i = 0; i < centerLine.length; i++) {
        const a = centerLine[i];
        const b = centerLine[(i + 1) % centerLine.length];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy);
        segments.push({ a, b, dx, dy, len, startS: totalLength });
        totalLength += len;
      }

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const wrapAngle = (a) => {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      };

      function pointAtS(s) {
        s = ((s % totalLength) + totalLength) % totalLength;
        for (const seg of segments) {
          if (s <= seg.startS + seg.len) {
            const t = (s - seg.startS) / seg.len;
            return {
              x: seg.a.x + seg.dx * t,
              y: seg.a.y + seg.dy * t,
              heading: Math.atan2(seg.dy, seg.dx),
            };
          }
        }
        const seg = segments[segments.length - 1];
        return { x: seg.b.x, y: seg.b.y, heading: Math.atan2(seg.dy, seg.dx) };
      }

      function nearestTrackInfo(x, y) {
        let best = {
          distance: Infinity,
          closestX: 0,
          closestY: 0,
          s: 0,
          tangent: 0,
        };

        for (const seg of segments) {
          const px = x - seg.a.x;
          const py = y - seg.a.y;
          const t = clamp((px * seg.dx + py * seg.dy) / (seg.len * seg.len), 0, 1);
          const cx = seg.a.x + seg.dx * t;
          const cy = seg.a.y + seg.dy * t;
          const dist = Math.hypot(x - cx, y - cy);
          if (dist < best.distance) {
            best = {
              distance: dist,
              closestX: cx,
              closestY: cy,
              s: seg.startS + seg.len * t,
              tangent: Math.atan2(seg.dy, seg.dx),
            };
          }
        }

        return best;
      }

      function sampleTrackDistance(x, y, angle, maxDist = 140, step = 4) {
        for (let d = 0; d <= maxDist; d += step) {
          const sx = x + Math.cos(angle) * d;
          const sy = y + Math.sin(angle) * d;
          if (nearestTrackInfo(sx, sy).distance > TRACK_RADIUS) {
            return d / maxDist;
          }
        }
        return 1;
      }

      function randomBrain() {
        const len = 24;
        return Array.from({ length: len }, () => (Math.random() * 2 - 1) * 0.8);
      }

      function cloneMutated(brain, rate = MUTATION_STRENGTH) {
        return brain.map((w) => w + (Math.random() * 2 - 1) * rate);
      }

      function decide(brain, inputs) {
        const hiddenA = Math.tanh(
          brain[0] * inputs[0] +
          brain[1] * inputs[1] +
          brain[2] * inputs[2] +
          brain[3] * inputs[3] +
          brain[4] * inputs[4] +
          brain[5]
        );
        const hiddenB = Math.tanh(
          brain[6] * inputs[0] +
          brain[7] * inputs[1] +
          brain[8] * inputs[2] +
          brain[9] * inputs[3] +
          brain[10] * inputs[4] +
          brain[11]
        );
        const steering = Math.tanh(
          brain[12] * hiddenA + brain[13] * hiddenB + brain[14] * inputs[5] + brain[15]
        );
        const throttle = 0.5 + 0.5 * Math.tanh(
          brain[16] * hiddenA + brain[17] * hiddenB + brain[18] * inputs[4] + brain[19]
        );
        const brake = 0.5 + 0.5 * Math.tanh(brain[20] * inputs[3] + brain[21] * (1 - inputs[0]) + brain[22] * inputs[1] + brain[23]);
        return { steering, throttle, brake };
      }

      class Car {
        constructor(brain) {
          const spawn = pointAtS(0);
          this.x = spawn.x;
          this.y = spawn.y;
          this.angle = spawn.heading;
          this.speed = 0;
          this.brain = brain;
          this.alive = true;
          this.progress = 0;
          this.lastS = 0;
          this.stuckTimer = 0;
        }

        update(dt) {
          if (!this.alive) return;

          const info = nearestTrackInfo(this.x, this.y);
          const headingError = wrapAngle(this.angle - info.tangent) / Math.PI;
          const sensors = [
            sampleTrackDistance(this.x, this.y, this.angle - 0.8),
            sampleTrackDistance(this.x, this.y, this.angle - 0.35),
            sampleTrackDistance(this.x, this.y, this.angle),
            sampleTrackDistance(this.x, this.y, this.angle + 0.35),
            sampleTrackDistance(this.x, this.y, this.angle + 0.8),
          ];

          const inputs = [...sensors, headingError];
          const action = decide(this.brain, inputs);

          const accel = action.throttle * 56 - action.brake * 38;
          this.speed += accel * dt;
          this.speed = clamp(this.speed, 8, 120);
          this.angle += action.steering * (1.45 - this.speed * 0.006) * dt;

          this.x += Math.cos(this.angle) * this.speed * dt;
          this.y += Math.sin(this.angle) * this.speed * dt;

          const current = nearestTrackInfo(this.x, this.y);
          const delta = ((current.s - this.lastS + totalLength * 0.5) % totalLength) - totalLength * 0.5;

          if (delta > -3) this.progress += Math.max(0, delta);
          this.lastS = current.s;

          if (current.distance > TRACK_RADIUS) {
            this.alive = false;
            return;
          }

          if (delta < 0.1) this.stuckTimer += dt;
          else this.stuckTimer = 0;

          if (this.stuckTimer > 1.8) this.alive = false;
        }

        draw(isLeader = false) {
          if (!this.alive && !isLeader) return;
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          ctx.fillStyle = isLeader ? '#ffe560' : 'rgba(117,197,255,0.28)';
          ctx.fillRect(-CAR_LENGTH / 2, -CAR_WIDTH / 2, CAR_LENGTH, CAR_WIDTH);
          ctx.fillStyle = isLeader ? '#ff944d' : 'rgba(187,225,255,0.45)';
          ctx.fillRect(2, -CAR_WIDTH / 2 + 1, 3, CAR_WIDTH - 2);
          ctx.restore();
        }
      }

      let generation = 1;
      let stepCount = 0;
      let bestEverProgress = 0;
      let championBrain = randomBrain();
      let cars = [];

      function spawnGeneration() {
        cars = [];
        for (let i = 0; i < POPULATION; i++) {
          if (i === 0) cars.push(new Car(championBrain.slice()));
          else cars.push(new Car(cloneMutated(championBrain, MUTATION_STRENGTH)));
        }
        stepCount = 0;
      }

      spawnGeneration();

      function evolve() {
        const best = cars.reduce((a, b) => (a.progress > b.progress ? a : b));
        championBrain = best.brain.slice();
        bestEverProgress = Math.max(bestEverProgress, best.progress);
        generation += 1;
        spawnGeneration();
      }

      function drawTrack() {
        ctx.fillStyle = '#101623';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.strokeStyle = '#2a3247';
        ctx.lineWidth = TRACK_RADIUS * 2 + 8;
        for (let i = 0; i < centerLine.length; i++) {
          const p = centerLine[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#444f69';
        ctx.lineWidth = TRACK_RADIUS * 2;
        for (let i = 0; i < centerLine.length; i++) {
          const p = centerLine[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#cfd8ff';
        ctx.setLineDash([12, 12]);
        ctx.lineWidth = 2;
        for (let i = 0; i < centerLine.length; i++) {
          const p = centerLine[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.setLineDash([]);

        const start = pointAtS(0);
        ctx.save();
        ctx.translate(start.x, start.y);
        ctx.rotate(start.heading + Math.PI / 2);
        ctx.fillStyle = '#ffffff';
        for (let i = -3; i < 3; i++) {
          ctx.fillRect(i * 12, -8, 8, 16);
        }
        ctx.restore();
      }

      let fpsClock = 0;
      let fpsFrames = 0;
      let fpsValue = 60;

      let last = performance.now();
      function loop(now) {
        const dtRaw = (now - last) / 1000;
        last = now;
        const dt = Math.min(1 / 25, dtRaw);

        stepCount++;
        let alive = 0;
        for (const car of cars) {
          car.update(dt);
          if (car.alive) alive++;
        }

        if (alive === 0 || stepCount >= MAX_STEPS) {
          evolve();
          alive = POPULATION;
        }

        drawTrack();

        const leader = cars.reduce((a, b) => (a.progress > b.progress ? a : b));
        for (const car of cars) car.draw(car === leader);

        hud.generation.textContent = `Поколение: ${generation}`;
        hud.alive.textContent = `В живых: ${alive}/${POPULATION}`;
        hud.bestDistance.textContent = `Лучшая дистанция: ${Math.floor(bestEverProgress)} px`;

        fpsClock += dtRaw;
        fpsFrames++;
        if (fpsClock > 0.4) {
          fpsValue = Math.round(fpsFrames / fpsClock);
          fpsClock = 0;
          fpsFrames = 0;
        }
        hud.fps.textContent = `FPS: ${fpsValue}`;

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
